<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DMRC Line 7 - viewer test suite</title>
<style>
:root{--bg:#05090f;--text:#8ab4f8;--bright:#dbeafe;--panel:#0f172a;--border:#1e293b;
      --ok:#22c55e;--bad:#ef4444;--skip:#f59e0b;--dim:#64748b}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);
     font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{font-size:14px;letter-spacing:.2em;color:var(--bright);margin:0 0 4px}
.sub{color:var(--dim);font-size:10.5px;letter-spacing:.1em;margin:0 0 18px}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.tot div{border:1px solid var(--border);background:var(--panel);padding:8px 14px;font-size:11px}
.tot b{font-size:17px;font-weight:400;display:block;letter-spacing:.05em}
.tot .p b{color:var(--ok)}.tot .f b{color:var(--bad)}.tot .s b{color:var(--skip)}
h2{font-size:11px;letter-spacing:.18em;color:var(--bright);margin:20px 0 6px;
   border-bottom:1px solid var(--border);padding-bottom:5px}
table{width:100%;border-collapse:collapse;margin:0 0 6px}
td{padding:3px 8px;border-bottom:1px solid #101a2b;vertical-align:top;font-size:11px}
td.s{width:52px;letter-spacing:.1em}
td.n{width:290px;color:var(--bright)}
td.d{color:var(--dim);font-size:10.5px}
.PASS{color:var(--ok)}.FAIL{color:var(--bad)}.SKIP{color:var(--skip)}
#host{position:fixed;left:-99999px;top:0;width:1280px;height:900px;border:0}
#host iframe{position:absolute;left:0;top:0}
iframe{border:0}
.note{color:var(--dim);font-size:10.5px;margin:6px 0 0}
/* checklist */
#cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px;margin:0 0 8px}
.cl{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);background:var(--panel);
    padding:6px 9px;font-size:11px}
.cl .box{width:15px;height:15px;flex:none;border:1px solid var(--dim);display:flex;
         align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.cl.PASS .box{border-color:var(--ok);color:var(--ok)}
.cl.FAIL .box{border-color:var(--bad);color:var(--bad)}
.cl.SKIP .box{border-color:var(--skip);color:var(--skip)}
.cl.MISSING .box{border-color:var(--dim);color:var(--dim)}
.cl .t{flex:1}
.cl .cat{display:block;color:var(--dim);font-size:9.5px;letter-spacing:.08em}
.cl .no{color:var(--dim)}
#clsum{border-left:3px solid var(--border);padding:2px 0 2px 10px;margin:0 0 16px;
       font-size:12px;color:var(--bright)}
</style>
</head>
<body>
<h1>DMRC LINE 7 - VIEWER TEST SUITE</h1>
<p class="sub">plain html + script, no build step &middot; drives the real viewer in an iframe
&middot; 26-check regression plan</p>
<div class="tot">
  <div class="p">PASS<b id="nP">0</b></div>
  <div class="f">FAIL<b id="nF">0</b></div>
  <div class="s">SKIP<b id="nS">0</b></div>
  <div>TOTAL<b id="nT">0</b></div>
</div>
<div id="clsum">checklist --</div>
<div id="cl"></div>
<div id="out"></div>
<div id="host"></div>
<script>
"use strict";
/* Exercises the real line7-timetable-timesync.html and line7-timetable-admin.html.
   Nothing here is part of a shipped viewer; this file is a development tool and
   is never inlined.

   The suite is organised around a 28-item regression checklist. Each assertion is
   tagged with the checklist item it belongs to, so the top of the page reports
   "N / 28 checked" rather than only a raw assertion count. A checklist item is
   checked only when every assertion under it passes; one failure unchecks it.
   Skips are reported but do not by themselves uncheck an item. */

var R = { pass: 0, fail: 0, skip: 0, rows: [] };
var VIEWER = "line7-timetable-timesync.html";
var ADMIN  = "line7-timetable-admin.html";

/* ---------------- the 29-item checklist ---------------- */
var CHECKS = [
  ["Data validation", "Missing L7_DATA or missing required properties"],
  ["Data validation", "Null or non-finite departure and terminal times"],
  ["Data validation", "Descending station times and duplicate trip IDs"],
  ["Data validation", "Invalid station indices and malformed service windows"],
  ["Data validation", "Loaded table with empty or incomplete direction arrays"],

  ["Time engine", "Exactly at trip departure and arrival"],
  ["Time engine", "Exactly at a station arrival/departure boundary"],
  ["Time engine", "Dwell intervals immediately below, at, and above 300 seconds"],
  ["Time engine", "Forward and backward time jumps"],
  ["Time engine", "Wrap disabled, first wrap, and repeated wraps"],

  ["Date programming", "Weekday, Saturday, and Sunday selection"],
  ["Date programming", "Exact-date override versus annual recurrence"],
  ["Date programming", "Duplicate dates and unloaded target tables"],
  ["Date programming", "Leap day and device timezone changes"],
  ["Date programming", "No valid timetable available"],

  ["Admin and export", "Corrupt and unsupported workbook uploads"],
  ["Admin and export", "Failed upload leaves previous valid data unchanged"],
  ["Admin and export", "Special characters in station names and metadata"],
  ["Admin and export", "Export with every expected placeholder replaced"],
  ["Admin and export", "Open exported HTML independently and verify its data guard"],

  ["Performance and usability", "Largest expected timetable at desktop and mobile widths"],
  ["Performance and usability", "Hidden tab and return to foreground"],
  ["Performance and usability", "Repeated resize and table changes"],
  ["Performance and usability", "Keyboard controls and focus behavior"],
  ["Performance and usability", "No uncaught console errors during playback"],
  ["Time engine", "Service clock across midnight and the after-midnight tail"],
  ["Duty roster", "Duty number or X shown above each train for the displayed time"],
  ["Service tabs", "AUTO and weekday / Saturday / Sunday / Special view selection"],
  ["Admin and export", "Upload re-map by station name and tolerant WEF dates"]
];
var NCHECK = CHECKS.length;

/* ---------------- assertion plumbing ---------------- */
var CUR = 0;
function C(n) { CUR = n; }
function rec(g, n, st, d) {
  R.rows.push({ check: CUR, g: g, n: n, st: st, d: d || "" });
  if (st === "PASS") R.pass++;
  else if (st === "FAIL") R.fail++;
  else R.skip++;
}
function ok(g, n, cond, d) { rec(g, n, cond ? "PASS" : "FAIL", d); }
function eq(g, n, got, want, d) {
  var c = String(got) === String(want);
  rec(g, n, c ? "PASS" : "FAIL",
      c ? d : "got " + JSON.stringify(got) + ", want " + JSON.stringify(want) + (d ? " - " + d : ""));
}
function skip(g, n, why) { rec(g, n, "SKIP", why); }
function near(a, b, eps) { return Math.abs(a - b) <= (eps === undefined ? 1e-9 : eps); }

/* Run fn, returning {ok, err}. `frag` (optional) must appear in the message. */
function throwsSync(fn, frag) {
  try { fn(); return { ok: false, err: "(did not throw)" }; }
  catch (e) {
    var m = String(e && e.message || e);
    return { ok: !frag || m.indexOf(frag) > -1, err: m };
  }
}
function rejects(asyncFn, frag) {
  return Promise.resolve().then(asyncFn).then(
    function () { return { ok: false, err: "(resolved, did not reject)" }; },
    function (e) {
      var m = String(e && e.message || e);
      return { ok: !frag || m.indexOf(frag) > -1, err: m };
    });
}

/* ---------------- harness ---------------- */
var host = document.getElementById("host");

function loadDoc(src, w) {
  return new Promise(function (res, rej) {
    var f = document.createElement("iframe");
    f.width = w || 1280; f.height = 900;
    f.srcdoc = src;
    f.onload = function () { res(f); };
    f.onerror = function () { rej(new Error("iframe failed")); };
    host.appendChild(f);
  });
}
function loadSrc(url, w) {
  return new Promise(function (res, rej) {
    var f = document.createElement("iframe");
    f.width = w || 1280; f.height = 900;
    f.src = url;
    f.onload = function () { res(f); };
    f.onerror = function () { rej(new Error("iframe failed to load " + url)); };
    host.appendChild(f);
  });
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function until(fn, ms) {
  var t0 = Date.now();
  while (Date.now() - t0 < (ms || 4000)) {
    try { if (fn()) return true; } catch (e) { }
    await sleep(25);
  }
  return false;
}
async function fetchText(url) {
  var r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.text();
}

/* An error collector plus an event-listener recorder is injected ahead of the
   viewer's own scripts, so a throw during boot is recorded rather than only
   visible in devtools, and the suite can see whether the page subscribes to
   visibility changes. */
var CATCH =
  '<script>window.__L7_NO_SYNC=1;window.__ERRS=[];window.__CERR=[];window.__EVT=[];' +
  'window.onerror=function(m){window.__ERRS.push(String(m));return true;};' +
  '(function(){var o=console.error;console.error=function(){' +
  'try{window.__CERR.push(Array.prototype.join.call(arguments," "));}catch(e){}' +
  'return o.apply(console,arguments);};})();' +
  '(function(){function wrap(t){var o=t.addEventListener;' +
  't.addEventListener=function(type){try{window.__EVT.push(String(type));}catch(e){}' +
  'return o.apply(this,arguments);};}wrap(window);wrap(document);})();' +
  '<\/script>';

/* ---------------- fault injection ---------------- */
var SENT_NAN = "@@L7_NONFINITE@@", SENT_INF = "@@L7_INFINITY@@";
var S_JSON = JSON.stringify(SENT_NAN), I_JSON = JSON.stringify(SENT_INF);
/* Payload strings that would be live XSS if any renderer used innerHTML. The
   closing script tag is written as a marker and only turned into a real,
   backslash-escaped closing tag in the mutated source, so it can never
   terminate this page's own script element. */
var SENT_ENDSCRIPT = "@@L7_ENDSCRIPT@@";
var XSS_IMG = '<img src=x onerror="window.__XSS=1">';
var XSS_SCRIPT = '<script>window.__XSS=2';
var XSS_TEXT = XSS_IMG + XSS_SCRIPT + "<" + "/script>";

function mutate(src, kind) {
  var k = src.indexOf("window.L7_DATA = ");
  if (kind === "nodata") {
    var st = src.indexOf("{", k), d = 0, i = st;
    for (;;) { if (src[i] === "{") d++; else if (src[i] === "}") { d--; if (!d) break; } i++; }
    return src.slice(0, k) + "/* removed by fault injection */" + src.slice(src.indexOf(";", i) + 1);
  }
  if (k < 0) return src;
  var s2 = src.indexOf("{", k), dd = 0, j = s2;
  for (;;) { if (src[j] === "{") dd++; else if (src[j] === "}") { dd--; if (!dd) break; } j++; }
  var end = src.indexOf(";", j) + 1;
  var head = src.slice(0, s2), txt = src.slice(s2, j + 1), tail = src.slice(end);
  var D = JSON.parse(txt);
  var wd = D.tables.weekday, t0 = wd.dn[0], a = t0.a, b = t0.b;

  switch (kind) {
    case "nocorridor": delete D.meta.corridor; break;
    case "noorder": delete D.order; break;
    case "noloadflag": delete wd.loaded; break;
    case "badwindow": wd.window = [wd.window[1], wd.window[0]]; break;
    case "equalwindow": wd.window = [wd.window[0], wd.window[0]]; break;
    case "nullwindow": wd.window = [null, wd.window[1]]; break;
    case "oobtrip": wd.dn[0].b = 999; break;
    case "negstart": wd.dn[0].a = -1; break;
    case "aafterb": wd.dn[0].a = wd.dn[0].b; break;
    case "badtime": wd.dn[0].t[a] = "nope"; break;
    case "shortt": wd.dn[0].t = [1, 2]; break;
    case "nullstart": wd.dn[0].t[a] = null; break;
    case "nullend": wd.dn[0].t[b] = null; break;
    case "nanstart": wd.dn[0].t[a] = SENT_NAN; break;
    case "infend": wd.dn[0].t[b] = SENT_INF; break;
    case "nonmono": wd.dn[0].t[a + 1] = wd.dn[0].t[a] - 60; break;
    case "zerodur":
      for (var z = wd.dn[0].a; z <= wd.dn[0].b; z++) wd.dn[0].t[z] = wd.dn[0].t[a];
      break;
    case "oobtime": wd.dn[0].t[b] = 2 * 86400; break;
    case "nulloutside":
      for (var o = b + 1; o < D.meta.corridor.length; o++) wd.dn[0].t[o] = null;
      break;
    case "duptrip": if (wd.dn[1]) wd.dn[1] = JSON.parse(JSON.stringify(wd.dn[0])); break;
    case "emptydir": wd.dn = []; break;
    case "notarray": wd.dn = {}; break;
    case "allunloaded":
      D.order.forEach(function (id) { if (D.tables[id]) D.tables[id].loaded = false; });
      break;
    case "dualtable":
      D.tables.saturday = JSON.parse(JSON.stringify(wd));
      D.tables.saturday.label = "SATURDAY";
      D.tables.saturday.loaded = true;
      break;
    case "specials":
      D.meta.corridor[0] = "A<em>x</em>B" + XSS_IMG + XSS_SCRIPT + SENT_ENDSCRIPT;
      D.meta.corridor[D.meta.corridor.length - 1] = D.meta.corridor[0];
      wd.label = 'L<&">B';
      break;
    case "bademeta":
      var mk = tail.indexOf("window.L7_META = ");
      tail = tail.slice(0, mk) + "window.L7_META = 7;" + tail.slice(tail.indexOf(";", mk) + 1);
      break;
  }
  return (head + JSON.stringify(D) + tail).split(S_JSON).join("NaN")
    .split(I_JSON).join("Infinity")
    .split(SENT_ENDSCRIPT).join("<\\/script>");
}

/* ---------------- groups ---------------- */
var T = {};

/* 1: live payload passes the guard and the board really starts. */
T.schema = async function (W) {
  var d = W.document, L = W.__L7, g = "A. schema guard (live data)";
  C(1);
  eq(g, "guard reports no error", W.__L7_DATA_ERROR, null, "valid payload must pass silently");
  eq(g, "no banner element", d.querySelectorAll("div.dataerr").length, 0);
  ok(g, "board is visible", getComputedStyle(d.getElementById("board")).display !== "none");
  ok(g, "sections were built", d.querySelectorAll("#sections .sec").length > 0,
     d.querySelectorAll("#sections .sec").length + " sections");
  ok(g, "trips were loaded", L.trips().length > 0, L.trips().length + " trips");
  eq(g, "body has no dataerr class", /dataerr/.test(d.body.className), false);
  if (W.__ERRS) eq(g, "no uncaught errors while booting", W.__ERRS.length, 0, W.__ERRS.join(" | "));
  else skip(g, "no uncaught errors while booting", "error collector not injectable from file://");
};

/* 1-5: structural / service-quality validation via fault injection. */
T.faults = async function (src) {
  var cases = [
    [1, "nodata",     "window.L7_DATA missing",          "window.L7_DATA is missing"],
    [1, "nocorridor", "meta.corridor removed",           "corridor is missing or empty"],
    [1, "noorder",    "order removed",                   "order is missing or empty"],
    [1, "noloadflag", "loaded flag removed",             ".loaded is not a boolean"],
    [1, "bademeta",   "L7_META is not an object",        "window.L7_META is not an object"],

    [2, "badtime",    "a stop time is a string",         "is not a time"],
    [2, "nanstart",   "departure time is NaN",           "is not a time"],
    [2, "infend",     "terminal time is Infinity",       "is not a time"],
    [2, "nullstart",  "departure time is null",          "is not a time"],
    [2, "nullend",    "terminal time is null",           "is not a time"],
    [2, "oobtime",    "a stop time is beyond 2 days",    "outside 0.."],
    [2, "zerodur",    "a trip takes no time at all",     "non-positive duration"],

    [3, "nonmono",    "station times descend",           "chronological"],
    [3, "duptrip",    "duplicate trip numbers",          "duplicate"],

    [4, "badwindow",  "window lo/hi reversed",           "window is not a [lo, hi] pair"],
    [4, "equalwindow","window lo == hi",                 "window is not a [lo, hi] pair"],
    [4, "nullwindow", "window bound is null",            "window is not a [lo, hi] pair"],
    [4, "oobtrip",    "trip b beyond corridor",          "outside 0.."],
    [4, "negstart",   "trip a is negative",              "outside 0.."],
    [4, "aafterb",    "trip a == b",                     "outside 0.."],

    [5, "shortt",     "t[] too short for the corridor",  "does not cover all"],
    [5, "notarray",   "direction is not an array",       "is not an array"],
    [5, "emptydir",   "direction array is empty",        "empty"]
  ];
  for (var c = 0; c < cases.length; c++) {
    var item = cases[c][0], kind = cases[c][1], want = cases[c][2], frag = cases[c][3];
    C(item);
    var g = "B. fault injection: " + want;
    var f;
    try { f = await loadDoc(CATCH + mutate(src, kind)); }
    catch (e) { skip(g, "iframe load", String(e.message)); continue; }
    var W = f.contentWindow, d = W.document;
    var box = d.querySelector("div.dataerr");
    var err = W.__L7_DATA_ERROR;
    ok(g, "reports an error", typeof err === "string" && err.length > 0, err || "(none)");
    ok(g, "reason names the fault", typeof err === "string" && err.indexOf(frag) > -1, err || "(none)");
    ok(g, "banner is shown", !!box && box.offsetHeight > 0);
    ok(g, "reason is displayed in the banner",
       !!box && (box.querySelector(".why b") || {}).textContent === err);
    eq(g, "board is hidden", getComputedStyle(d.getElementById("board")).display, "none");
    eq(g, "render loop never started", !!W.__L7, false, "no rAF, no __L7");
    eq(g, "no sections drawn", d.querySelectorAll("#sections .sec").length, 0);
    eq(g, "no uncaught errors", (W.__ERRS || []).length, 0, (W.__ERRS || []).join(" | "));
    f.parentNode.removeChild(f);
  }

  /* The mirror image of the null tests above: a null OUTSIDE a trip's active
     span [a,b] is the expected value, not a defect. If the guard ever starts
     demanding a time on every row, this catches it. */
  C(2);
  var gOut = "B. schema guard: nulls outside the active span are accepted";
  try {
    var fOut = await loadDoc(CATCH + mutate(src, "nulloutside"));
    var Wout = fOut.contentWindow;
    eq(gOut, "a null outside [a,b] does not trip the guard", Wout.__L7_DATA_ERROR, null,
       Wout.__L7_DATA_ERROR || "");
    ok(gOut, "the board still boots", !!Wout.__L7, "no __L7");
    eq(gOut, "no uncaught errors", (Wout.__ERRS || []).length, 0, (Wout.__ERRS || []).join(" | "));
    fOut.parentNode.removeChild(fOut);
  } catch (e) {
    skip(gOut, "iframe load", String(e.message));
  }
};

/* 11,12,14,15: date programming decided by the viewer's two rules. */
T.dates = async function (W) {
  var L = W.__L7, d = W.document;
  function R(y, mo, da, h) { return L.resolveTable(new Date(y, mo, da, h === undefined ? 12 : h)); }

  C(11);
  var g = "C. day-of-week selection";
  eq(g, "Thu 24 Sep 2026 -> weekday", R(2026, 8, 24).id, "weekday");
  eq(g, "Fri -> weekday", R(2026, 8, 25).id, "weekday");
  eq(g, "Mon -> weekday", R(2026, 8, 28).id, "weekday");
  eq(g, "Sat 26 Sep 2026 -> saturday", R(2026, 8, 26).id, "saturday");
  eq(g, "Sun 27 Sep 2026 -> sunday", R(2026, 8, 27).id, "sunday");
  eq(g, "day-of-week path is labelled AUTO", R(2026, 8, 26).how, "AUTO");
  eq(g, "saturday never auto-selects special", R(2026, 8, 26).id !== "special", true);

  C(12);
  g = "C. exact-date override vs annual recurrence";
  /* An annual entry on 24 Sep and an exact entry on 24 Sep 2026 point at
     different tables. The exact date is the more specific rule, so it must win
     regardless of the order the entries were written in. */
  L.setProgram([{ date: "2000-09-24", table: "sunday", annual: true },
                { date: "2026-09-24", table: "saturday", annual: false }]);
  eq(g, "exact-date wins when the annual entry is listed first", R(2026, 8, 24).id, "saturday");
  L.setProgram([{ date: "2026-09-24", table: "saturday", annual: false },
                { date: "2000-09-24", table: "sunday", annual: true }]);
  eq(g, "exact-date wins when the annual entry is listed second", R(2026, 8, 24).id, "saturday");
  eq(g, "the annual rule still applies in a later year", R(2031, 8, 24).id, "sunday");
  L.setProgram([{ date: "2026-09-24", table: "saturday", annual: false }]);
  eq(g, "one-off override matches its own date", R(2026, 8, 24).how, "DATE OVERRIDE");
  eq(g, "one-off override does not repeat next year", R(2027, 8, 24).how, "AUTO");
  L.setProgram([]);

  C(13);
  g = "C. duplicate dates and unloaded target tables";
  L.setProgram([{ date: "2026-09-24", table: "saturday", annual: false },
                { date: "2026-09-24", table: "special", annual: false }]);
  var d1 = R(2026, 8, 24).id;
  L.setProgram([{ date: "2026-09-24", table: "special", annual: false },
                { date: "2026-09-24", table: "saturday", annual: false }]);
  var d2 = R(2026, 8, 24).id;
  eq(g, "two entries on one date resolve the same way in either order", d1, d2,
     "first order gave " + d1 + ", reversed gave " + d2);
  /* An override to a table with no data must fall back, and say so. */
  L.setProgram([{ date: "2026-09-24", table: "saturday", annual: false }]);
  L.at(21600, new Date(2026, 8, 24, 12));
  eq(g, "an override to an unloaded table falls back", d.getElementById("tblHow").textContent, "FALLBACK");
  eq(g, "the fallback shows a table that is loaded", d.getElementById("tblName").textContent, "WEEKDAY");
  eq(g, "the notice is raised for the substitution", /\bnl\b/.test(d.body.className), true);
  var lrf = L.last();
  eq(g, "the fallback records the requested table", lrf && lrf.requested, "saturday",
     "requested = " + (lrf && lrf.requested));
  eq(g, "the fallback records the displayed table", lrf && lrf.displayed, "weekday",
     "displayed = " + (lrf && lrf.displayed));
  eq(g, "the fallback is not reported as a refusal", !!(lrf && lrf.refused), false);
  eq(g, "the fixed readout pairs displayed with requested",
     d.getElementById("selFixed").textContent, "WEEKDAY  SHOWN FOR SATURDAY");
  /* Strict mode is the opposite decision: refuse rather than substitute. */
  L.setStrict(true);
  L.at(21600, new Date(2026, 8, 24, 12));
  eq(g, "strict mode reports REFUSED", d.getElementById("tblHow").textContent, "REFUSED");
  eq(g, "strict mode titles the refusal", d.getElementById("nlTitle").textContent,
     "STRICT MODE - SERVICE REFUSED");
  eq(g, "strict mode marks the board", /\bstrict\b/.test(d.body.className), true);
  eq(g, "strict mode is not a fallback", /\bfb\b/.test(d.body.className), false);
  eq(g, "strict mode draws no trains", d.querySelectorAll("#sections .train").length, 0);
  ok(g, "strict readout names the unsubstituted table",
     /SATURDAY/.test(d.getElementById("selFixed").textContent) &&
     /STRICT/.test(d.getElementById("selFixed").textContent),
     d.getElementById("selFixed").textContent);
  var lrs = L.last();

/* ---------------- render ---------------- */
function checkStatus(n) {
  var rows = R.rows.filter(function (r) { return r.check === n; });
  if (!rows.length) return "MISSING";
  if (rows.some(function (r) { return r.st === "FAIL"; })) return "FAIL";
  if (rows.every(function (r) { return r.st === "SKIP"; })) return "SKIP";
  return "PASS";
}
function render() {
  document.getElementById("nP").textContent = R.pass;
  document.getElementById("nF").textContent = R.fail;
  document.getElementById("nS").textContent = R.skip;
  document.getElementById("nT").textContent = R.rows.length;

  var checked = 0, cl = "";
  for (var n = 1; n <= NCHECK; n++) {
    var st = checkStatus(n);
    if (st === "PASS") checked++;
    var mark = st === "PASS" ? "\u2713" : st === "FAIL" ? "\u2715" : "-";
    cl += '<div class="cl ' + st + '"><span class="box">' + mark + '</span><span class="t">' +
      '<span class="cat">' + CHECKS[n - 1][0] + ' &middot; ' + n + '</span>' +
      CHECKS[n - 1][1] + '</span></div>';
  }
  document.getElementById("cl").innerHTML = cl;
  document.getElementById("clsum").innerHTML =
    "<b>" + checked + " / " + NCHECK + "</b> checklist items checked &middot; " +
    "<span class='PASS'>" + R.pass + " pass</span>, " +
    "<span class='FAIL'>" + R.fail + " fail</span>, " +
    "<span class='SKIP'>" + R.skip + " skip</span>";

  var h = "";
  for (var c = 1; c <= NCHECK; c++) {
    var rows = R.rows.filter(function (r) { return r.check === c; });
    if (!rows.length) continue;
    h += "<h2>" + c + ". " + CHECKS[c - 1][0] + " &middot; " + CHECKS[c - 1][1] +
         " <span class='" + checkStatus(c) + "'>[" + checkStatus(c) + "]</span></h2><table>";
    rows.forEach(function (r) {
      h += "<tr><td class='s " + r.st + "'>" + r.st + "</td><td class='n'>" + r.n +
           "</td><td class='d'>" + (r.d || "").replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</td></tr>";
    });
    h += "</table>";
  }
  document.getElementById("out").innerHTML = h;

  var v = R.pass + "/" + (R.pass + R.fail) + " passed" + (R.skip ? ", " + R.skip + " skipped" : "");
  document.title = (R.fail ? "FAIL " : "OK ") + checked + "/" + NCHECK + " checks, " + R.fail + " failed";
  document.body.dataset.result = R.fail ? "fail" : "pass";
  document.body.dataset.pass = R.pass;
  document.body.dataset.fail = R.fail;
  document.body.dataset.skip = R.skip;
  document.body.dataset.checked = checked;
  document.body.dataset.total = NCHECK;
  window.__TEST_RESULT = {
    pass: R.pass, fail: R.fail, skip: R.skip, checked: checked, total: NCHECK,
    rows: R.rows,
    checklist: CHECKS.map(function (c, i) { return { n: i + 1, cat: c[0], name: c[1], status: checkStatus(i + 1) }; })
  };
  console.log("L7 TEST: " + checked + "/" + NCHECK + " checks, " + v);
}

  catch (e) { why = "needs http://, not file:// (" + e.message + ")"; }
  try { srcAdmin = await fetchText(ADMIN); } catch (e) { srcAdmin = null; }

  /* -- the main viewer -- */
  var f, W, got;
  try {
    f = srcViewer ? await loadDoc(CATCH + srcViewer) : await loadSrc(VIEWER);
  } catch (e) {
    rec("harness", "viewer loaded", "FAIL", String(e.message || e));
    render(); return;
  }
  W = f.contentWindow;
  got = await until(function () { return W.__L7 && W.document.querySelectorAll("#sections .sec").length > 0; }, 8000);
  if (!got) {
    rec("harness", "viewer booted", "FAIL",
        "iframe never exposed __L7 (guard error: " + W.__L7_DATA_ERROR + ")");
    render(); return;
  }

  await T.schema(W);
  await T.dates(W);
  await T.timeEngine(W);
  await T.midnight(W);
  await T.sections(W);
  await T.visibility(W);
  await T.keyboard(W);
  await T.playback(W);
  await T.widths(f, W);
  await T.duty(W);
  await T.tabs(W);
  await T.rebuild(f, W);
  if (f.parentNode) f.parentNode.removeChild(f);

  /* -- structural fault injection (needs the viewer source) -- */
  if (srcViewer) {
    await T.faults(srcViewer);
    var fv;
    try {
      fv = await loadDoc(CATCH + mutate(srcViewer, "allunloaded"));
      if (await until(function () { return !!fv.contentWindow.__L7; }, 6000)) await T.noTable(fv.contentWindow);
      else { C(15); skip("C. no valid timetable available", "variant booted", "no __L7"); }
      fv.parentNode.removeChild(fv);
    } catch (e) { C(15); skip("C. no valid timetable available", "variant load", String(e.message)); }

    try {
      var fs = await loadDoc(CATCH + mutate(srcViewer, "specials"));
      if (await until(function () { return !!fs.contentWindow.__L7; }, 6000)) await T.specials(fs.contentWindow);
      else { C(18); skip("F. special characters", "variant booted", "no __L7"); }
      fs.parentNode.removeChild(fs);
    } catch (e) { C(18); skip("F. special characters", "variant load", String(e.message)); }

    try {
      var fd = await loadDoc(CATCH + mutate(srcViewer, "dualtable"));
      if (await until(function () {
            return fd.contentWindow.__L7 && fd.contentWindow.document.querySelectorAll("#sections .sec").length > 0;
          }, 6000)) await T.tableChange(fd.contentWindow);
      else { C(23); skip("E. table changes", "variant booted", "no __L7"); }
      fd.parentNode.removeChild(fd);
    } catch (e) { C(23); skip("E. table changes", "variant load", String(e.message)); }
  } else {
    C(1); skip("B. fault injection", "all structural cases", why);
    C(15); skip("C. no valid timetable available", "allunloaded variant", why);
    C(18); skip("F. special characters", "specials variant", why);
  }

  /* -- the administration console: upload boundary and export -- */
  if (srcAdmin) {
    var fa;
    try {
      fa = await loadDoc(CATCH + srcAdmin);
      var WA = fa.contentWindow;
      if (await until(function () { return !!WA.__L7_ADMIN; }, 8000)) {
        await T.admin(WA);
      } else {
        C(16); skip("F. admin console", "hook exposed", "__L7_ADMIN never appeared");
      }
      fa.parentNode.removeChild(fa);
    } catch (e) {
      C(16); skip("F. admin console", "iframe load", String(e.message));
    }
  } else {
    C(16); skip("F. workbook upload boundary", "admin source", "could not fetch " + ADMIN);
    C(17); skip("F. failed upload is inert", "admin source", "could not fetch " + ADMIN);
    C(19); skip("F. export placeholders", "admin source", "could not fetch " + ADMIN);
    C(20); skip("F. exported viewer", "admin source", "could not fetch " + ADMIN);
  }

  render();
})();
</script>
</body>
</html>
